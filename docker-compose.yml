name: linkedin-easy-apply

services:
  postgres:
    image: postgres:15-alpine
    container_name: linkedin-easy-apply-postgres
    environment:
      POSTGRES_DB: linkedin_jobs
      POSTGRES_USER: linkedin_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - linkedin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin_user -d linkedin_jobs"]
      interval: 10s
      timeout: 5s
      retries: 5

  action-server:
    build: .
    container_name: linkedin-easy-apply-action-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Database configuration - choose one:
      # Option 2: PostgreSQL (use postgres service above)
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://linkedin_user:dev_password@postgres:5432/linkedin_jobs
      # Google OAuth2 credentials
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Server URL for OAuth2 redirect (REQUIRED for tunnel/proxy setup)
      - SERVER_URL=https://linkedin-easy-apply-actions.joshyorko.com
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linkedin-network
    volumes:
      - action-server-output:/action-server/actions/output
      - action-server-data:/action-server/datadir

  retro-ui:
    build: ./retro-ui
    container_name: linkedin-easy-apply-retro-ui
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      # Point to action server container
      - ACTION_SERVER_URL=http://action-server:8080
      # Pass action server API key (optional) for backend proxy auth
      #- ACTION_SERVER_API_KEY=${ACTION_SERVER_API_KEY}
      # Database path (if using SQLite via volume mount)
      - DB_PATH=/data/linkedin_jobs.sqlite
      # For PostgreSQL (alternative)
      - DATABASE_TYPE=postgres
      - DATABASE_URL=postgresql://linkedin_user:dev_password@postgres:5432/linkedin_jobs
    #depends_on:
    #  - action-server
    #  - postgres
    restart: unless-stopped
    networks:
      - linkedin-network
    volumes:
      # Mount SQLite database if using DATABASE_TYPE=sqlite
      - ./src:/data:ro
      # Share action-server output logs for viewing in UI
      - action-server-output:/app/output:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); });"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: linkedin-easy-apply-cloudflared
    command: tunnel run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      action-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - linkedin-network

networks:
  linkedin-network:
    driver: bridge

volumes:
  action-server-data:
  action-server-output:
  postgres_data:
